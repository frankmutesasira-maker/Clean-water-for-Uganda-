<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation Status | Clean Water for Uganda</title><style>body{font-family:Arial;max-width:700px;margin:60px auto;padding:20px;background:#f5f9fc}input,button{padding:13px;margin-top:10px;width:100%;box-sizing:border-box}button{background:#0879d1;color:white;border:0;border-radius:6px}</style></head><body><a href="index.html">← Home</a><h1>Check donation status</h1><p>Enter your donation reference, for example CWU-2026-XXXXXXXX.</p><input id="ref" placeholder="CWU-2026-XXXXXXXX"><button onclick="check()">Check status</button><div id="out"></div><script>async function check(){const ref=document.getElementById('ref').value.trim();const r=await fetch('/api/donation-status?reference='+encodeURIComponent(ref));const d=await r.json();document.getElementById('out').innerHTML='<h2>'+((d.status||'NOT FOUND'))+'</h2>'+(d.message?'<p>'+d.message+'</p>':'')+(d.amount?'<p>Amount: $'+d.amount+'<br>Project: '+d.project+'<br>Payment: '+d.payment_method+'</p>':'')}</script></body></html>

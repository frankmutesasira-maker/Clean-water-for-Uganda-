<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donate | Clean Water for Uganda</title><style>body{font-family:system-ui;margin:0;background:#f8fafc;color:#0f172a}.wrap{max-width:760px;margin:50px auto;padding:20px}.card{background:#fff;padding:28px;border-radius:16px;border:1px solid #e2e8f0}label{display:block;font-weight:700;margin:14px 0 6px}input,select,button{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{background:#063b5c;color:#fff;font-weight:800;margin-top:20px;cursor:pointer}.notice{background:#eff6ff;padding:15px;border-radius:10px;margin:18px 0}</style></head><body><div class="wrap"><a href="/">← Home</a><h1>Support clean water in Uganda</h1><div class="card"><form id="form"><label>First name<input name="firstName" required></label><label>Last name<input name="lastName" required></label><label>Email<input type="email" name="email" required></label><label>Country<input name="country"></label><label>Amount (USD)<input type="number" name="amount" min="1" step="0.01" required></label><label>Project<select name="designation"><option value="where-needed-most">Where needed most</option><option value="boreholes">Boreholes</option><option value="schools">Schools</option><option value="communities">Communities</option></select></label><label>Payment method<select name="payment_method"><option value="bank-transfer">Bank transfer</option><option value="remittance">Remittance</option><option value="online">Online payment</option></select></label><div class="notice">Your donation is recorded as <strong>pending</strong> until payment is independently verified.</div><button>Continue donation</button></form><p id="msg"></p></div></div><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const payload={amount:Number(f.get('amount')),currency:'USD',frequency:'one-time',designation:f.get('designation'),payment_method:f.get('payment_method'),donor:{firstName:f.get('firstName'),lastName:f.get('lastName'),email:f.get('email'),country:f.get('country')}};const r=await fetch('/api/create-donation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok){document.getElementById('msg').textContent=d.error||'Unable to continue.';return}location.href=d.next==='bank-transfer'?'/donate/bank-transfer.html?reference='+encodeURIComponent(d.reference):'/donate/remittance.html?reference='+encodeURIComponent(d.reference)})</script></body></html>

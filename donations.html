<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verified Donations | Clean Water for Uganda</title><style>body{font-family:Arial;max-width:850px;margin:auto;padding:30px;color:#123047}.row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:14px;border-bottom:1px solid #ddd}h1{color:#063b67}.live{color:#09965a}</style></head><body><a href="index.html">← Home</a><h1>Verified Donations <span class="live">● LIVE</span></h1><p id="summary">Loading…</p><div id="list"></div><script>async function load(){const d=await fetch('/api/public-donations').then(r=>r.json());document.getElementById('summary').textContent='Verified donors: '+(d.donors||0)+' · Total displayed: $'+Number(d.total||0).toLocaleString();document.getElementById('list').innerHTML=(d.donations||[]).map(x=>`<div class="row"><span>${x.first_name}</span><span>${x.country}</span><strong>$${Number(x.amount).toLocaleString()}</strong></div>`).join('')||'<p>No verified public donations yet.</p>'}load();setInterval(load,30000)</script></body></html>

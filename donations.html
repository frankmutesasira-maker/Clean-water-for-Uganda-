<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Donations | Clean Water for Uganda</title>
<meta name="description" content="Live verified donation display for Clean Water for Uganda.">
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:900px;margin:auto;padding:24px;background:#f8fafc;color:#0f172a}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.live{font-weight:800}.wall{margin-top:24px;display:grid;gap:12px}.donation{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:6px 16px}.name{font-weight:800}.amount{font-weight:900;font-size:1.35rem}.country{color:#64748b;font-size:.92rem}.muted{color:#64748b}.error{color:#b00020}.empty{background:#fff;border:1px dashed #cbd5e1;padding:24px;border-radius:16px}
</style>
</head>
<body>
<div class="top"><div><strong>Clean Water for Uganda</strong><h1>Live Donations</h1></div><div class="live">● LIVE</div></div>
<p class="muted">Verified donations appear automatically. Each donor is shown by first name and country only.</p>
<div id="state" class="muted">Loading…</div>
<section id="wall" class="wall" aria-live="polite"></section>
<script>
const money=(n,c)=>new Intl.NumberFormat(undefined,{style:'currency',currency:c||'USD',maximumFractionDigits:2}).format(n);
function safe(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML;}
async function load(){
 const state=document.querySelector('#state'),wall=document.querySelector('#wall');
 try{
  const r=await fetch('/api/public-donations?limit=100',{cache:'no-store'});
  if(!r.ok) throw new Error('Unable to load donations');
  const data=await r.json();
  wall.innerHTML='';
  for(const d of data.donations){
   const card=document.createElement('article');card.className='donation';
   card.innerHTML=`<div><div class="name">${safe(d.donorName||'Anonymous')}</div><div class="country">${safe(d.country||'Country not provided')}</div></div><div class="amount">${money(d.amount,d.currency)}</div>`;
   wall.appendChild(card);
  }
  state.textContent=data.donations.length?`${data.donations.length} verified donations`:'No verified donations yet.';
  if(!data.donations.length) wall.innerHTML='<div class="empty">Verified donations will appear here automatically.</div>';
 }catch(e){state.className='error';state.textContent=e.message;}
}
load();setInterval(load,15000);
</script>
</body>
</html>

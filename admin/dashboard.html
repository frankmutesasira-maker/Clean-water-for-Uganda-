<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clean Water for Uganda — Finance Dashboard</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a}.wrap{max-width:1100px;margin:auto;padding:32px 20px}h1{margin-bottom:6px}.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px}.value{font-size:1.8rem;font-weight:800;margin-top:8px}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0}section{margin-top:24px;overflow:auto}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Finance Dashboard</h1>
<p class="muted">Clean Water for Uganda — verified donation reporting</p>
<div class="grid">
<div class="card"><div class="muted">Verified total</div><div class="value" id="total">—</div></div>
<div class="card"><div class="muted">Verified donations</div><div class="value" id="verified">—</div></div>
<div class="card"><div class="muted">Pending</div><div class="value" id="pending">—</div></div>
<div class="card"><div class="muted">Published projects</div><div class="value" id="projects">—</div></div>
</div>
<section><h2>Verified donations by payment method</h2><table><thead><tr><th>Method</th><th>Currency</th><th>Count</th><th>Total</th></tr></thead><tbody id="methods"><tr><td colspan="4">Loading…</td></tr></tbody></table></section>
<section><h2>Donation report</h2><table><thead><tr><th>Reference</th><th>Date</th><th>Donor</th><th>Amount</th><th>Method</th><th>Status</th><th>Receipt</th></tr></thead><tbody id="report"><tr><td colspan="7">Loading…</td></tr></tbody></table></section>
</div>
<script>
const money=(n,c)=>new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD'}).format(Number(n||0));
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
async function load(){
 const d=await (await fetch('/api/admin/dashboard')).json();
 document.getElementById('total').textContent=money(d.verifiedTotal,'USD');
 document.getElementById('verified').textContent=d.verifiedDonations;
 document.getElementById('pending').textContent=d.pendingDonations;
 document.getElementById('projects').textContent=d.publishedProjects;
 document.getElementById('methods').innerHTML=d.byPaymentMethod.map(x=>`<tr><td>${esc(x.paymentMethod)}</td><td>${esc(x.currency)}</td><td>${x.count}</td><td>${money(x.total,x.currency)}</td></tr>`).join('')||'<tr><td colspan="4">No verified donations.</td></tr>';
 const r=await (await fetch('/api/admin/reports')).json();
 document.getElementById('report').innerHTML=r.rows.map(x=>`<tr><td>${esc(x.donation_reference)}</td><td>${esc(new Date(x.created_at).toLocaleDateString())}</td><td>${esc(x.first_name)} ${esc(x.last_name)}</td><td>${money(x.amount,x.currency)}</td><td>${esc(x.payment_method)}</td><td>${esc(x.status)}</td><td>${esc(x.receipt_number||'—')}</td></tr>`).join('')||'<tr><td colspan="7">No donations.</td></tr>';
}
load().catch(e=>console.error(e));
</script>
</body>
</html>

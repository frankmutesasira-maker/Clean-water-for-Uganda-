<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation Status | Clean Water for Uganda</title><style>body{font-family:system-ui;background:#f8fafc;color:#0f172a}.wrap{max-width:700px;margin:60px auto;padding:20px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:28px}input,button{padding:13px;width:100%;font:inherit;border:1px solid #cbd5e1;border-radius:9px;margin-top:8px}button{background:#063b5c;color:white;font-weight:800}.status{margin-top:20px;padding:18px;background:#eff6ff;border-radius:12px}</style></head><body><div class="wrap"><a href="/">← Home</a><h1>Donation status</h1><div class="card"><form id="form"><label>Donation reference<input name="reference" required></label><button>Check status</button></form><div id="result"></div></div></div><script>const q=new URLSearchParams(location.search);if(q.get('reference'))document.querySelector('[name=reference]').value=q.get('reference');document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const ref=e.target.reference.value.trim();const r=await fetch('/api/donation-status?reference='+encodeURIComponent(ref));const d=await r.json();document.getElementById('result').innerHTML=r.ok?`<div class="status"><strong>${d.status.toUpperCase()}</strong><p>Reference: ${d.reference}</p><p>Amount: ${d.currency} ${Number(d.amount).toFixed(2)}</p><p>Project: ${d.project}</p></div>`:`<div class="status">${d.error||'Not found'}</div>`})</script></body></html>

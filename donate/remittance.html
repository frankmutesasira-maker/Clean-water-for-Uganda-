<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remittance | Clean Water for Uganda</title><style>body{font-family:system-ui;margin:0;background:#f8fafc;color:#0f172a}.wrap{max-width:700px;margin:50px auto;padding:20px}.card{background:#fff;padding:28px;border-radius:16px;border:1px solid #e2e8f0}input,button{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;margin-top:7px}button{background:#063b5c;color:#fff;font-weight:800;margin-top:20px}</style></head><body><div class="wrap"><a href="/donate.html">← Donation page</a><h1>Remittance confirmation</h1><div class="card"><p>Complete your remittance using your chosen provider, then submit the reference below. Funds remain pending until verified.</p><form id="form"><label>Provider<input name="provider" placeholder="Remittance provider" required></label><label>Transfer reference<input name="transfer_reference" required></label><label>Transfer date<input type="date" name="transfer_date"></label><label>Amount (USD)<input type="number" name="amount" min="1" step="0.01" required></label><button>Submit remittance</button></form><p id="msg"></p></div></div><script>const reference=new URLSearchParams(location.search).get('reference')||'';document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/remittance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference,provider:f.get('provider'),transfer_reference:f.get('transfer_reference'),transfer_date:f.get('transfer_date'),amount:Number(f.get('amount')),currency:'USD'})});const d=await r.json();document.getElementById('msg').textContent=r.ok?'Submitted. Your remittance is pending verification.':(d.error||'Unable to submit.');if(r.ok)setTimeout(()=>location.href='/donate/status.html?reference='+encodeURIComponent(reference),800)})</script></body></htm
